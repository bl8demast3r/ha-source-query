[project]
name = "ha-source-query"
version = "0.1.0"
description = "Home Assistant integration for Source/A2S game servers"
requires-python = ">=3.14"
license = "MIT"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.372",
    "python-a2s==1.4.2",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "homeassistant"]
force-sort-within-sections = true
combine-as-imports = true
